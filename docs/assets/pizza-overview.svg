<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
 <title id="title">Pizza — conversão de arquivos no gesto</title>
 <desc id="desc">Ilustração do conceito: um menu circular de formatos e o fluxo Ctrl mais arrastar, soltar e clicar.</desc>
 <defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111a30"/><stop offset="1" stop-color="#233e67"/></linearGradient>
  <linearGradient id="slice" x2="0" y2="1"><stop stop-color="#72a4ff" stop-opacity=".7"/><stop offset="1" stop-color="#3666b3" stop-opacity=".25"/></linearGradient>
  <path id="segment" d="M-63-132 A146 146 0 0 1 63-132 L38-80 A89 89 0 0 0-38-80Z"/>
 </defs>
 <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
 <g fill="#edf4ff" font-family="Segoe UI,Arial,sans-serif">
  <text x="70" y="132" font-size="72" font-weight="600">Pizza</text>
  <text x="74" y="184" font-size="25">Conversão de arquivos no gesto.</text>
  <text x="74" y="246" font-size="21" fill="#bdcfea">Ctrl + arrastar → soltar → clicar</text>
  <text x="74" y="294" font-size="17" fill="#a5bad9">Windows · Processamento local · Original preservado</text>
  <text x="74" y="359" font-size="14" fill="#a5bad9">Ilustração do conceito · Prévia de desenvolvimento</text>
 </g>
 <g transform="translate(955 210)">
  <circle r="175" fill="#a6c5fc" fill-opacity=".08" stroke="#ccdeff" stroke-opacity=".25"/>
  <g fill="url(#slice)" stroke="#b6d1ff" stroke-opacity=".6">
   <use href="#segment"/><use href="#segment" transform="rotate(60)"/><use href="#segment" transform="rotate(120)"/>
   <use href="#segment" transform="rotate(180)"/><use href="#segment" transform="rotate(240)"/><use href="#segment" transform="rotate(300)"/>
  </g>
  <g fill="#edf4ff" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16">
   <text y="-111">PNG</text><text x="100" y="-52">WEBP</text><text x="100" y="65">AVIF</text>
   <text y="124">PDF</text><text x="-100" y="65">TIFF</text><text x="-100" y="-52">ICO</text>
   <text y="5" font-size="21">Pizza</text><text y="30" font-size="12" fill="#bdcfea">Escolha o formato</text>
  </g>
 </g>
</svg>
