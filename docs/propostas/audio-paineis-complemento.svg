<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><title>Complemento proposto dos painéis de áudio</title><desc>Estudo estático, não captura do aplicativo. Quatro formatos nos temas claro e escuro. Volume recolhido é uma proposta pendente da preferência do mantenedor.</desc><rect width="1600" height="1000" fill="#f1f3f9"/><g font-family="Segoe UI,sans-serif" fill="#111827"><text x="48" y="53" font-size="28" font-weight="600">Áudio · complemento dos quatro painéis</text><text x="48" y="84" font-size="15">Proposta para conferir · não substitui AU-1/AU-2 · sem alteração no aplicativo</text><text x="48" y="130" font-size="19" font-weight="600">Tema claro</text><text x="824" y="130" font-size="19" font-weight="600">Tema escuro</text></g><rect x="806" y="145" width="746" height="770" rx="28" fill="#111522"/><g transform="translate(48 170)"><rect width="348" height="354" rx="24" fill="#ffffff" stroke="#c8cfdf"/><g font-family="Segoe UI,sans-serif" fill="#0f1320"><text x="24" y="38" font-size="21" font-weight="600">MP3</text><text x="24" y="66" font-size="14">Qualidade</text><rect x="24" y="89" width="222" height="4" rx="2" fill="#c8cfdf"/><circle cx="142" cy="91" r="8" fill="#2f6aff"/><rect x="24" y="111" width="300" height="30" rx="8" fill="none" stroke="#c8cfdf"/><text x="34" y="132" font-size="13">192 kbps</text><text x="24" y="169" font-size="13">Canais  Original · Estéreo · Mono</text><text x="24" y="197" font-size="13">Taxa      Original · 48 kHz · 44,1 kHz</text><rect x="24" y="214" width="300" height="44" rx="12" fill="none" stroke="#c8cfdf"/><text x="36" y="242" font-size="14">▸ Volume e dinâmica · desligado</text><text x="24" y="283" fill="#39425a" font-size="11">~ tamanho pela duração e taxa</text><rect x="174" y="298" width="150" height="44" rx="12" fill="#2f6aff"/><text x="249" y="326" text-anchor="middle" fill="white" font-size="14">Converter</text><text x="63" y="326" font-size="14">Cancelar</text></g></g><g transform