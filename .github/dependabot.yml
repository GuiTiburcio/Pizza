version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init e analyze do CodeQL precisam da mesma versão; em PRs separados, os dois falham.
      codeql:
        patterns:
          - "github/codeql-action*"
