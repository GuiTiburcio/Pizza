name: Arquivos corrompidos

# TST-03: rodada grande, semanal. Cada PR já roda 100 casos no CI principal.
on:
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  corrompidos:
    name: Arquivos corrompidos no Worker
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      # A semente muda a cada rodada, para não repetir sempre os mesmos casos.
      - name: Rodar
        env:
          PIZZA_FUZZ_CASES: 5000
          PIZZA_FUZZ_SEED: ${{ github.run_number }}
        run: dotnet test tests/Pizza.Integration.Tests -c Release --no-build --filter "FullyQualifiedName~CorruptedFilesTests"

      - name: Guardar os casos reprovados
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: casos-reprovados
          path: TestResults/fuzz
          if-no-files-found: ignore
          retention-days: 30
