name: Prévia

# ADR-031: prévias 0.x saem só daqui, a partir de uma tag v*-previa* num commit que já está na main.
on:
  push:
    tags: ['v*-previa*']

permissions:
  contents: read

concurrency:
  group: previa-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  previa:
    name: Testar, empacotar e publicar a prévia
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # criar o pré-lançamento
      id-token: write # atestado de proveniência
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Conferir que a tag está na main
        shell: pwsh
        run: |
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'A tag não aponta para um commit da main.' }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      # TST-14: verificador independente, só para teste; nunca entra no pacote (igual ao CI).
      - name: Baixar ExifTool
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'exiftool.zip'
          $hash = '9C79E97A9444BA1F893DA1DCBCAE378FBA0C0A0112AFD8BF426B396C75F884CE'
          foreach ($url in 'https://exiftool.org/exiftool-13.62_64.zip', 'https://sourceforge.net/projects/exiftool/files/exiftool-13.62_64.zip/download') {
            try { Invoke-WebRequest $url -OutFile $zip -UserAgent 'pizza-ci' -MaximumRedirection 5 } catch { continue }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -eq $hash) { $ok = $true; break }
          }
          if (-not $ok) { throw 'ExifTool não baixado ou com hash diferente.' }
          $folder = Join-Path $env:RUNNER_TEMP 'exiftool'
          Expand-Archive $zip $folder
          $exe = Get-ChildItem $folder -Recurse -Filter 'exiftool(-k).exe' | Select-Object -First 1
          $tool = Join-Path $exe.DirectoryName 'exiftool.exe'
          Rename-Item $exe.FullName $tool
          "PIZZA_EXIFTOOL=$tool" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Testar
        run: dotnet test Pizza.slnx -c Release --no-build

      - name: Publicar residente (NativeAOT) e Worker
        run: |
          dotnet publish src/Pizza.App -c Release -o artifacts/previa/Pizza
          dotnet publish src/Pizza.Worker -c Release -o artifacts/previa/Pizza

      - name: Empacotar
        id: pacote
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Remove-Item artifacts/previa/Pizza/*.pdb
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md artifacts/previa/Pizza
          $zip = "artifacts/previa/Pizza-$tag-win-x64.zip"
          Compress-Archive artifacts/previa/Pizza/* $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File artifacts/previa/SHA256SUMS -Encoding ascii
          "zip=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: artifacts/previa/Pizza
          format: cyclonedx-json
          output-file: artifacts/previa/sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Atestado de proveniência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pacote.outputs.zip }}

      - name: Publicar como pré-lançamento
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag --prerelease --verify-tag --title "Pizza $tag" --notes-file .github/previa-notas.md `
            "${{ steps.pacote.outputs.zip }}" artifacts/previa/SHA256SUMS artifacts/previa/sbom.cdx.json
