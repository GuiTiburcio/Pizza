name: diag-alac
# TEMPORARIO (issue 101): removido antes do commit final.
on:
  push:
    branches: [fix/alac-101]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  laco:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore tests/Pizza.Converters.Tests
      - name: Compilar
        run: dotnet build tests/Pizza.Converters.Tests -c Release --no-restore
      - name: Laco de 40 rodadas
        shell: pwsh
        run: |
          $falhas = @(); $rodadasComFalha = 0
          for ($i = 1; $i -le 40; $i++) {
            $saida = dotnet test tests/Pizza.Converters.Tests -c Release --no-build --nologo --filter "FullyQualifiedName~AudioConverterTests|FullyQualifiedName~AudioConcurrencyTests" --logger "console;verbosity=normal" 2>&1 | Out-String
            $linhas = @($saida -split "`r?`n" | Where-Object { $_ -match 'DIAG|Failed Pizza|Failed ' })
            if ($LASTEXITCODE -ne 0) { $rodadasComFalha++; $falhas += $linhas; if (-not ($linhas | Where-Object { $_ -match 'DIAG' })) { $falhas += ($saida -split "`r?`n" | Where-Object { $_ -match 'Error Message|Exception|Assert' } | Select-Object -First 6) } }
          }
          "=== RESUMO: rodadas com falha = $rodadasComFalha de 40 ==="
          $falhas | Group-Object | Sort-Object Count -Descending | ForEach-Object { "{0,3}x {1}" -f $_.Count, $_.Name.Trim() }
          if ($rodadasComFalha -gt 0) { exit 1 }
