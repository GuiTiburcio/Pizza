name: diag-alac
# TEMPORARIO (issue 101): removido antes do commit final.
on:
  push:
    branches: [fix/alac-101]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  laco:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restaurar
        run: dotnet restore tests/Pizza.Converters.Tests
      - name: Compilar
        run: dotnet build tests/Pizza.Converters.Tests -c Release --no-restore
      - name: Estresse por variante
        shell: pwsh
        run: |
          foreach ($v in 0, 3, 0, 3, 0, 3) {
            $env:PIZZA_DIAG_VARIANT = "$v"
            $saida = dotnet test tests/Pizza.Converters.Tests -c Release --no-build --nologo --filter "FullyQualifiedName~ZStress" --logger "console;verbosity=normal" 2>&1 | Out-String
            ($saida -split "`r?`n" | Where-Object { $_ -match 'variant=' } | Select-Object -First 1).Trim()
          }
