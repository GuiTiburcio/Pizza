name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, testes e NativeAOT
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Com CI=true o restore usa o lockfile: dependência fora dele quebra o build (TST-24).
      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      # TST-14: verificador independente. Só para teste; nunca entra no pacote do Pizza.
      # A versão atual fica em exiftool.org e as antigas no SourceForge; o hash vale para as duas origens.
      - name: Baixar ExifTool
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'exiftool.zip'
          $hash = '9C79E97A9444BA1F893DA1DCBCAE378FBA0C0A0112AFD8BF426B396C75F884CE'
          foreach ($url in 'https://exiftool.org/exiftool-13.62_64.zip', 'https://sourceforge.net/projects/exiftool/files/exiftool-13.62_64.zip/download') {
            try { Invoke-WebRequest $url -OutFile $zip -UserAgent 'pizza-ci' -MaximumRedirection 5 } catch { continue }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -eq $hash) { $ok = $true; break }
          }
          if (-not $ok) { throw 'ExifTool não baixado ou com hash diferente.' }
          $folder = Join-Path $env:RUNNER_TEMP 'exiftool'
          Expand-Archive $zip $folder
          $exe = Get-ChildItem $folder -Recurse -Filter 'exiftool(-k).exe' | Select-Object -First 1
          $tool = Join-Path $exe.DirectoryName 'exiftool.exe'
          Rename-Item $exe.FullName $tool
          "PIZZA_EXIFTOOL=$tool" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Testar
        run: dotnet test Pizza.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Publicar residente (NativeAOT)
        run: dotnet publish src/Pizza.App -c Release -o artifacts/publish/app

      - name: Publicar Worker
        run: dotnet publish src/Pizza.Worker -c Release -o artifacts/publish/app

      - name: Tamanho do Pizza.exe
        shell: pwsh
        run: |
          $kb = [math]::Round((Get-Item artifacts/publish/app/Pizza.exe).Length / 1KB)
          "Pizza.exe: $kb KB" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Guardar Pizza e Worker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pizza-win-x64
          path: |
            artifacts/publish/app
            !artifacts/publish/app/*.pdb
          retention-days: 14
