name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, testes e NativeAOT
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      - name: Testar
        run: dotnet test Pizza.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Publicar residente (NativeAOT)
        run: dotnet publish src/Pizza.App -c Release -o artifacts/publish/app

      - name: Tamanho do Pizza.exe
        shell: pwsh
        run: |
          $kb = [math]::Round((Get-Item artifacts/publish/app/Pizza.exe).Length / 1KB)
          "Pizza.exe: $kb KB" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Guardar Pizza.exe
        uses: actions/upload-artifact@v4
        with:
          name: pizza-win-x64
          path: artifacts/publish/app/Pizza.exe
          retention-days: 14
