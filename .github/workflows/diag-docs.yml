# TEMPORARIO: diagnostico do WORKER_CRASHED do motor de documentos. Remover antes do commit final.
name: Diag docs

on:
  push:
    branches: [fix/docs-worker-crash]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  diag:
    name: Laco ${{ matrix.modo }} ${{ matrix.n }}
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 1, modo: doc, rodadas: 10 }
          - { n: 2, modo: doc, rodadas: 10 }
          - { n: 3, modo: doc, rodadas: 10 }

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      - name: Baixar motor de documentos
        shell: pwsh
        run: |
          $motor = Join-Path $env:RUNNER_TEMP 'motor'
          ./tools/baixar-motor.ps1 -Destino $motor
          "PIZZA_MOTOR=$motor" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Laco
        shell: pwsh
        run: |
          $falhas = 0
          $n = ${{ matrix.rodadas }}
          for ($i = 1; $i -le $n; $i++) {
            if ('${{ matrix.modo }}' -eq 'doc') {
              $saida = dotnet test tests/Pizza.Integration.Tests -c Release --no-build --filter "FullyQualifiedName~DocumentTests" --logger "console;verbosity=normal" 2>&1 | Out-String
            } else {
              $saida = dotnet test Pizza.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | Out-String
            }
            $codigo = $LASTEXITCODE
            $linhas = $saida -split "`r?`n" | Where-Object { $_ -match 'DIAG|^\s+Failed |Failed!|Passed!|Skipped!' }
            if ($codigo -ne 0) { $falhas++ }
            Write-Host "=== rodada $i : exit $codigo"
            $linhas | ForEach-Object { Write-Host $_ }
          }
          Write-Host "RESUMO: $falhas rodadas com falha em $n (job ${{ matrix.n }}, ${{ matrix.modo }})"
          exit 0
