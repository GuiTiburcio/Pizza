# TEMPORARIO: diagnostico do WORKER_CRASHED do motor de documentos. Remover antes do commit final.
name: Diag docs

on:
  push:
    branches: [fix/docs-worker-crash]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  diag:
    name: Laco DocumentTests (${{ matrix.n }})
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restaurar
        run: dotnet restore Pizza.slnx

      - name: Compilar
        run: dotnet build Pizza.slnx -c Release --no-restore

      - name: Baixar motor de documentos
        shell: pwsh
        run: |
          $motor = Join-Path $env:RUNNER_TEMP 'motor'
          ./tools/baixar-motor.ps1 -Destino $motor
          "PIZZA_MOTOR=$motor" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Laco de 20 rodadas
        shell: pwsh
        run: |
          $falhas = 0
          for ($i = 1; $i -le 20; $i++) {
            $saida = dotnet test tests/Pizza.Integration.Tests -c Release --no-build --filter "FullyQualifiedName~DocumentTests" --logger "console;verbosity=normal" 2>&1 | Out-String
            $linhas = $saida -split "`r?`n" | Where-Object { $_ -match 'DIAG|^\s+(Failed|Passed) |Failed!|Passed!|Error Message' }
            $falhou = $saida -match 'Failed!'
            if ($falhou) { $falhas++ }
            Write-Host "=== rodada $i : $(if ($falhou) { 'FALHOU' } else { 'ok' })"
            if ($falhou) { $linhas | ForEach-Object { Write-Host $_ } }
          }
          Write-Host "RESUMO: $falhas falhas em 20 rodadas (job ${{ matrix.n }})"
